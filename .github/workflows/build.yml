name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp fastapi "uvicorn[standard]" pyyaml websockets pyinstaller
      shell: cmd

    - name: Read version
      id: version
      run: |
        python -c "import json; v=json.load(open('version.json'))['version']; print('VERSION='+v)" >> %GITHUB_OUTPUT%
      shell: cmd

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed ^
          --name "JAMES_Swing_Lite" ^
          --add-data "config;config" ^
          --add-data "version.json;." ^
          --hidden-import "james_swing_lite" ^
          --hidden-import "james_swing_lite.app" ^
          --hidden-import "james_swing_lite.dashboard" ^
          --hidden-import "james_swing_lite.updater" ^
          --hidden-import "james_swing_lite.config" ^
          --hidden-import "james_swing_lite.domain" ^
          --hidden-import "james_swing_lite.strategy" ^
          --hidden-import "james_swing_lite.sentiment" ^
          --hidden-import "james_swing_lite.market_data" ^
          --hidden-import "james_swing_lite.indicators" ^
          --hidden-import "james_swing_lite.paper_execution" ^
          --hidden-import "james_swing_lite.accounting" ^
          --hidden-import "james_swing_lite.position" ^
          --hidden-import "james_swing_lite.risk" ^
          --hidden-import "james_swing_lite.storage" ^
          --hidden-import "james_swing_lite.health" ^
          --hidden-import "james_swing_lite.market_state" ^
          --hidden-import "uvicorn.logging" ^
          --hidden-import "uvicorn.loops" ^
          --hidden-import "uvicorn.loops.auto" ^
          --hidden-import "uvicorn.protocols" ^
          --hidden-import "uvicorn.protocols.http" ^
          --hidden-import "uvicorn.protocols.http.auto" ^
          --hidden-import "uvicorn.protocols.websockets" ^
          --hidden-import "uvicorn.protocols.websockets.auto" ^
          --hidden-import "uvicorn.lifespan" ^
          --hidden-import "uvicorn.lifespan.on" ^
          --hidden-import "aiohttp" ^
          --hidden-import "yaml" ^
          --collect-all "aiohttp" ^
          lite_app.py
      shell: cmd

    - name: Prepare release folder
      run: |
        mkdir release
        copy dist\JAMES_Swing_Lite.exe release\JAMES_Swing_Lite.exe
        powershell -Command "$vbs = \"Set oShell = CreateObject(\"\"WScript.Shell\"\")`r`nstrDir = CreateObject(\"\"Scripting.FileSystemObject\"\").GetParentFolderName(WScript.ScriptFullName)`r`noShell.Run chr(34) & strDir & \"\"\\JAMES_Swing_Lite.exe\"\" & chr(34), 1, False\"; [System.IO.File]::WriteAllText('release\JAMES-SWING-LITE-RUN.vbs', $vbs, [System.Text.Encoding]::UTF8)"
        dir release\
      shell: cmd

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JAMES-SWING-LITE-WINDOWS
        path: release\
        if-no-files-found: error
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: "JAMES Swing Lite v${{ steps.version.outputs.VERSION }}"
        body: |
          ## JAMES Swing Lite v${{ steps.version.outputs.VERSION }}

          ### Install
          1. Download `JAMES_Swing_Lite.exe`
          2. Double-click to run (no Python required)
          3. Dashboard opens automatically at http://127.0.0.1:8780

          ### Features
          - BTCUSDT / ADAUSDT swing analysis
          - Paper trading mode (no real orders)
          - Auto-update support
        files: |
          release/JAMES_Swing_Lite.exe
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp fastapi "uvicorn[standard]" pyyaml websockets pyinstaller
      shell: cmd

    - name: Read version
      id: version
      run: |
        python -c "import json; v=json.load(open('version.json'))['version']; print('VERSION='+v)" >> %GITHUB_OUTPUT%
      shell: cmd

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed ^
          --name "JAMES_Swing_Lite" ^
          --add-data "config;config" ^
          --add-data "version.json;." ^
          --hidden-import "james_swing_lite" ^
          --hidden-import "james_swing_lite.app" ^
          --hidden-import "james_swing_lite.dashboard" ^
          --hidden-import "james_swing_lite.updater" ^
          --hidden-import "james_swing_lite.config" ^
          --hidden-import "james_swing_lite.domain" ^
          --hidden-import "james_swing_lite.strategy" ^
          --hidden-import "james_swing_lite.sentiment" ^
          --hidden-import "james_swing_lite.market_data" ^
          --hidden-import "james_swing_lite.indicators" ^
          --hidden-import "james_swing_lite.paper_execution" ^
          --hidden-import "james_swing_lite.accounting" ^
          --hidden-import "james_swing_lite.position" ^
          --hidden-import "james_swing_lite.risk" ^
          --hidden-import "james_swing_lite.storage" ^
          --hidden-import "james_swing_lite.health" ^
          --hidden-import "james_swing_lite.market_state" ^
          --hidden-import "uvicorn.logging" ^
          --hidden-import "uvicorn.loops" ^
          --hidden-import "uvicorn.loops.auto" ^
          --hidden-import "uvicorn.protocols" ^
          --hidden-import "uvicorn.protocols.http" ^
          --hidden-import "uvicorn.protocols.http.auto" ^
          --hidden-import "uvicorn.protocols.websockets" ^
          --hidden-import "uvicorn.protocols.websockets.auto" ^
          --hidden-import "uvicorn.lifespan" ^
          --hidden-import "uvicorn.lifespan.on" ^
          --hidden-import "aiohttp" ^
          --hidden-import "yaml" ^
          --collect-all "aiohttp" ^
          lite_app.py
      shell: cmd

    - name: List dist folder
      run: dir dist\
      shell: cmd

    - name: Create launcher VBS
      run: |
        echo Set oShell = CreateObject("WScript.Shell") > "dist\JAMES SWING LITE 실행.vbs"
        echo oShell.Run chr(34) ^& WScript.ScriptFullName ^& chr(34), 0, False >> "dist\JAMES SWING LITE 실행.vbs"
        echo Set objFSO = CreateObject("Scripting.FileSystemObject") >> "dist\JAMES SWING LITE 실행.vbs"
        echo strDir = objFSO.GetParentFolderName(WScript.ScriptFullName) >> "dist\JAMES SWING LITE 실행.vbs"
        echo Set oShell2 = CreateObject("WScript.Shell") >> "dist\JAMES SWING LITE 실행.vbs"
        echo oShell2.Run chr(34) ^& strDir ^& "\JAMES_Swing_Lite.exe" ^& chr(34), 1, False >> "dist\JAMES SWING LITE 실행.vbs"
      shell: cmd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JAMES-SWING-LITE-WINDOWS
        path: dist\
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: "JAMES Swing Lite v${{ steps.version.outputs.VERSION }}"
        body: |
          ## JAMES Swing Lite v${{ steps.version.outputs.VERSION }}

          ### 설치 방법
          1. `JAMES_Swing_Lite.exe` 다운로드
          2. 더블클릭으로 실행 (Python 설치 불필요)
          3. 브라우저에서 자동으로 대시보드 열림 (http://127.0.0.1:8780)

          ### 특징
          - BTCUSDT / ADAUSDT 스윙 분석
          - 페이퍼트레이딩 모드 (실거래 없음)
          - 자동 업데이트 지원
        files: |
          dist/JAMES_Swing_Lite.exe
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}